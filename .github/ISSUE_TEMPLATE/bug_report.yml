name: Bug report
description: Something doesn't work or the app crashes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem! Please make sure you're on the [latest release](https://github.com/KrunchMuffin/SimpleMarkdownViewer/releases/latest) first. Security problems should be [reported privately](https://github.com/KrunchMuffin/SimpleMarkdownViewer/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Help > About (or on the installer file name).
      placeholder: "1.5.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "Windows 11 Pro 24H2 (build 26100)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it's specific to a document, attach it or paste the smallest part that shows the problem.
      placeholder: |
        1. Open a file containing ...
        2. Press ...
        3. See ...
  - type: textarea
    id: crash-details
    attributes:
      label: Crash details (Windows)
      description: |
        If the app crashes or won't start, open **Event Viewer > Windows Logs > Application** and look for entries at the time of the crash. Please paste both:
        - the **Application Error** entry for SimpleMarkdownViewer.exe
        - the **.NET Runtime** entry just before it (it contains the error and stack trace)
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, custom CSS in use, accessibility or automation tools running, etc.
